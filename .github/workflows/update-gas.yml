name: Update gas prices

on:
  # Manual rebuild only — GasBuddy blocks GitHub's IPs, so the scheduled
  # fetch runs on the assistant's worker and pushes via the deploy key.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and rebuild page
        env:
          GAS_DATA_ROOT: ${{ github.workspace }}/data
          SHARE_OUT: ${{ github.workspace }}/.shareable.json
        run: |
          python3 scripts/extract_shareable.py
          python3 scripts/build_site.py --data .shareable.json --template template.html --out index.html
          rm .shareable.json

      - name: Commit and push
        run: |
          git config user.name "Vesper"
          git config user.email "vesper@local"
          git add index.html data/latest.json data/areas/latest.json data/areas/history/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "gas prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

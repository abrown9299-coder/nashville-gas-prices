name: probe-gasbuddy

# TEMPORARY diagnostic — tests whether a GitHub Actions runner IP can reach
# GasBuddy with browser impersonation (curl_cffi). Delete after the test.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Probe GasBuddy
        run: python3 probe/probe_gasbuddy.py
